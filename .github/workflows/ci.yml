name: CI

on:
  push:
    branches: ["main", "chore/**", "feat/**", "fix/**", "security/**", "research/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Detect Secrets Baseline Verification
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets
          detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [security]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff Lint
        run: ruff check src tests

      - name: Run Ruff Format Check
        run: ruff format --check src tests

      - name: Run Mypy Type Check
        run: mypy src

      - name: Run Pytest Suite with Coverage
        run: pytest --cov=aidax --cov-report=xml --cov-report=term-missing
