apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aidax-ingress
  namespace: aidax
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: aidax-service
spec:
  rules:
    - host: aidax.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aidax-service
                port:
                  number: 8000
