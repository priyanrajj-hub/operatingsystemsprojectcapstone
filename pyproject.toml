[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidax-lite"
version = "1.0.0"
description = "Adaptive CPU scheduling simulator using LinUCB contextual bandit, FastAPI telemetry, and evaluation harness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Priyan", email = "priyan@example.com" }
]
keywords = [
    "operating-systems",
    "cpu-scheduling",
    "reinforcement-learning",
    "contextual-bandit",
    "linucb",
    "fastapi",
    "psutil",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Operating System",
]
dependencies = [
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "aiosqlite>=0.19.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
llm = [
    "google-generativeai>=0.3.0",
]

[project.scripts]
aidax-scheduler = "aidax.scheduler:main"
aidax-eval = "aidax.evaluate:main"
aidax-dashboard = "aidax.api:run_server"
aidax-workload = "aidax.workload:main"
aidax-analysis = "aidax.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E501",   # Line length handled by formatter
    "B008",   # Do not perform function call in argument defaults (FastAPI design)
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --cov=aidax --cov-report=term-missing"
